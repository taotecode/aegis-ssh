name: Bug report / 缺陷报告
description: Report a reproducible problem without sharing credentials or infrastructure secrets.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Sanitize aliases, hostnames, addresses, commands, logs, and screenshots before submitting.

  - type: input
    id: version
    attributes:
      label: Aegis SSH version
      description: Run `aegis-ssh --help` and include the displayed version.
      placeholder: v0.4.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS arm64
        - macOS amd64
        - Linux arm64
        - Linux amd64
        - Other
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Not Agent-specific
        - Codex
        - Claude Code
        - Gemini CLI
        - Cursor
        - VS Code
        - OpenClaw
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sanitized sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only reviewed output. Never attach vault, recovery, credential, private-key, or raw audit data.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Security check
      options:
        - label: I removed credentials, recovery material, private infrastructure details, and other secrets from this report.
          required: true
