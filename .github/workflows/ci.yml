name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build targets
        shell: bash
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath -o "/tmp/aegis-${target%/*}-${target#*/}" ./cmd/aegis-ssh
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-ssh-packages
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
